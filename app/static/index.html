<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geosmin — Your medication story, safely shared | Medication Safety Platform</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['"Playfair Display"', 'Georgia', 'serif'],
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            mono: ['"JetBrains Mono"', '"SF Mono"', 'Monaco', 'Inconsolata', 'monospace']
          },
          colors: {
            navy: {
              DEFAULT: '#1F3A5F',
              hover: '#152943',
              dark: '#0E1E33',
              light: '#2A4D78',
              50: '#F0F4F8'
            },
            teal: {
              DEFAULT: '#2A7F85',
              soft: '#E6F4F4',
              light: '#EAF6F6',
              hover: '#22696E',
              border: '#A2D2D5'
            },
            sand: {
              DEFAULT: '#FAF9F6',
              50: '#FAF9F6',
              100: '#F4F3EF',
              200: '#EAE8E2',
              300: '#D8D5CC'
            }
          },
          boxShadow: {
            'xs': '0 1px 2px 0 rgba(0, 0, 0, 0.04)',
            'card': '0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px -1px rgba(0, 0, 0, 0.05)',
            'elevated': '0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05)',
            'beacon-red': '0 0 0 0 rgba(220, 38, 38, 0.3)',
            'beacon-amber': '0 0 0 0 rgba(217, 119, 6, 0.3)',
            'beacon-teal': '0 0 0 0 rgba(42, 127, 133, 0.3)'
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Inter, Playfair Display, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,500;1,600&display=swap" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="/static/css/custom.css?v=2.1.0">
</head>
<body class="bg-[#FAF9F6] text-slate-800 antialiased min-h-screen selection:bg-teal-100 selection:text-teal-900">
  <!-- Screen reader live updates -->
  <div id="sr-announcer" class="sr-only" aria-live="polite"></div>

  <!-- App Mount Root -->
  <div id="app-root"></div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col space-y-2 pointer-events-none"></div>

  <!-- Warning Detail Modal -->
  <div id="warning-detail-modal" class="hidden fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4"></div>

  <!-- Physical Consultation Room Security: Anti-Shoulder-Surfing Privacy Shield Overlay -->
  <div id="privacy-shield-overlay" class="hidden-shield" aria-hidden="true">
    <div class="bg-slate-900/90 border border-slate-700/80 rounded-2xl p-8 max-w-md mx-4 text-center shadow-2xl backdrop-blur-md">
      <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-teal-900/50 border border-teal-500/50 flex items-center justify-center text-teal-400">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
      </div>
      <h3 class="text-xl font-serif font-bold text-white mb-2">Privacy Shield Active</h3>
      <p class="text-xs text-slate-300 font-mono tracking-wider uppercase mb-3 text-teal-400">Anti-Shoulder Surfing Mode (HIPAA § 164.312)</p>
      <p class="text-sm text-slate-300 mb-6">Screen blurred to protect electronic Protected Health Information (ePHI) while tab is unfocused.</p>
      <button onclick="dismissPrivacyShield()" class="px-5 py-2.5 bg-[#2A7F85] hover:bg-[#22696E] text-white text-sm font-semibold rounded-xl shadow-md transition cursor-pointer">
        Resume Consultation
      </button>
    </div>
  </div>

  <!-- Graph Visualization Engines: Cytoscape.js, WebCola, cytoscape-cola, D3.js v7 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
  <script src="https://unpkg.com/webcola@3.4.0/WebCola/cola.min.js"></script>
  <script src="https://unpkg.com/cytoscape-cola@2.5.1/cytoscape-cola.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>

  <!-- Custom Pharmacological Graph Visualizer -->
  <script src="/static/js/graph_visualizer.js?v=2.1.0"></script>

  <!-- App Script -->
  <script src="/static/js/app.js?v=2.1.0"></script>
</body>
</html>
